<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<title>招聘流水沿阶段推进，收窄点需要被看见</title><desc>Geometry Blue board.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#111111"/></marker>
<marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#2F6BFF"/></marker></defs>
<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">招聘流水沿阶段推进，收窄点需要被看见</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">来源 → 初筛 → 面试 → 复盘 → Offer → 接受</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><line x1="186" y1="360" x2="294" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="150" cy="360" r="34" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="150" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">来源</text><text x="150" y="442" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11px" font-weight="400" fill="#999999">Sourced</text><line x1="366" y1="360" x2="474" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="330" cy="360" r="31" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="330" y="419" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">初筛</text><text x="330" y="439" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11px" font-weight="400" fill="#999999">Screen</text><line x1="546" y1="360" x2="654" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="510" cy="360" r="30" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/><circle cx="510" cy="316" r="6" fill="#2F6BFF"/><text x="510" y="416" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">面试</text><text x="510" y="436" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11px" font-weight="400" fill="#999999">Interview</text><line x1="726" y1="360" x2="834" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="690" cy="360" r="25" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="690" y="413" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">复盘</text><text x="690" y="433" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11px" font-weight="400" fill="#999999">Debrief</text><line x1="906" y1="360" x2="1014" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="870" cy="360" r="22" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="870" y="410" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">Offer</text><text x="870" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11px" font-weight="400" fill="#999999">Offer</text><circle cx="1050" cy="360" r="19" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="1050" y="407" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">接受</text><text x="1050" y="427" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11px" font-weight="400" fill="#999999">Accepted</text><text x="510" y="296" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="650" fill="#2F6BFF">收窄点</text><text x="600" y="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">每一阶段留下人数与损耗，收窄的位置最该先看</text></svg>