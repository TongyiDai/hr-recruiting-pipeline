<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<title>范围和字段先固定，报告才可复核</title><desc>Geometry Blue board.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#111111"/></marker>
<marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#2F6BFF"/></marker></defs>
<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">范围和字段先固定，报告才可复核</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">授权范围 · 最小字段 → 本地聚合 → 可复核报告</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><rect x="120" y="300" width="190" height="84" rx="0" fill="#F5F5F5" stroke="#222222" stroke-width="1.5"/><text x="215" y="340" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">授权范围</text><text x="215" y="362" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">谁 · 什么时间</text><rect x="120" y="420" width="190" height="84" rx="0" fill="#F5F5F5" stroke="#222222" stroke-width="1.5"/><text x="215" y="460" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">最小字段</text><text x="215" y="482" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">阶段 · 时长 · 渠道</text><circle cx="560" cy="404" r="64" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="560" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">本地聚合</text><text x="560" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">规则可复核</text><circle cx="560" cy="340" r="7" fill="#2F6BFF"/><path d="M 310 342 C 430 342 460 404 496 404" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 310 462 C 430 462 460 404 496 404" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="624" y1="404" x2="760" y2="404" stroke="#2F6BFF" stroke-width="1.5" marker-end="url(#arrowB)"/><rect x="760" y="362" width="190" height="84" rx="0" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/><text x="855" y="402" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">可复核报告</text><text x="855" y="424" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">分布 · 转换 · 时长</text><path d="M 560 468 C 560 540 560 540 560 556" fill="none" stroke="#B8B8B8" stroke-width="1.5" stroke-dasharray="4 6"/><text x="560" y="584" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#999999">未知阶段 / 缺字段 → 标注待人工</text><text x="600" y="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">先固定范围与字段，再聚合成可复核结论</text></svg>