<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<title>飞书读取先验证身份，再读取最小字段</title><desc>Geometry Blue board.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#111111"/></marker>
<marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#2F6BFF"/></marker></defs>
<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">飞书读取先验证身份，再读取最小字段</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">身份 → 资源 → 字段映射 → 只读 → 本地分析</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><rect x="450" y="190" width="300" height="64" rx="0" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/><text x="600" y="220" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">用户身份</text><text x="600" y="242" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">identity=user · verified</text><line x1="600" y1="254" x2="600" y2="268" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="450" y="268" width="300" height="64" rx="0" fill="#F5F5F5" stroke="#222222" stroke-width="1.5"/><text x="600" y="298" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">飞书资源</text><text x="600" y="320" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">Base / Sheets</text><line x1="600" y1="332" x2="600" y2="346" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="450" y="346" width="300" height="64" rx="0" fill="#F5F5F5" stroke="#222222" stroke-width="1.5"/><text x="600" y="376" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">字段映射</text><text x="600" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">最小必要字段</text><line x1="600" y1="410" x2="600" y2="424" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="450" y="424" width="300" height="64" rx="0" fill="#F5F5F5" stroke="#222222" stroke-width="1.5"/><text x="600" y="454" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">只读记录</text><text x="600" y="476" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">不写回 · 不改状态</text><line x1="600" y1="488" x2="600" y2="502" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="450" y="502" width="300" height="64" rx="0" fill="#F5F5F5" stroke="#222222" stroke-width="1.5"/><text x="600" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">本地分析</text><text x="600" y="554" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">聚合在本地</text><circle cx="450" cy="222" r="6" fill="#2F6BFF"/><text x="870" y="226" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="650" fill="#2F6BFF">先过身份</text><text x="600" y="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">身份不清就停在第一步，原始数据不进入仓库</text></svg>