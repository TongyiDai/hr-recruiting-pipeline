<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<title>聚合数据提供证据，招聘决定由人做出</title><desc>Geometry Blue board.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#111111"/></marker>
<marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#2F6BFF"/></marker></defs>
<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">聚合数据提供证据，招聘决定由人做出</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">系统整理事实与提示；录用 / 淘汰 / 排序由人负责</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><rect x="112" y="200" width="452" height="322" rx="0" fill="#F5F5F5"/><rect x="704" y="200" width="384" height="322" rx="0" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/><line x1="640" y1="188" x2="640" y2="540" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="5 7"/><text x="338" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" fill="#666666">Agent 可以做</text><text x="896" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" fill="#666666">招聘负责人</text><rect x="200" y="314" width="72" height="88" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><line x1="216" y1="336" x2="256" y2="336" stroke="#B8B8B8" stroke-width="1"/><line x1="216" y1="352" x2="256" y2="352" stroke="#B8B8B8" stroke-width="1"/><line x1="216" y1="368" x2="244" y2="368" stroke="#B8B8B8" stroke-width="1"/><text x="236" y="428" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">聚合数据</text><line x1="272" y1="358" x2="330" y2="358" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="330" y="322" width="90" height="72" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="375" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">标记</text><text x="375" y="375" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">待核项</text><line x1="420" y1="358" x2="616" y2="358" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="640" cy="358" r="17" fill="#2F6BFF"/><text x="640" y="300" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="650" fill="#2F6BFF">复核点</text><line x1="664" y1="358" x2="756" y2="358" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="870" cy="358" r="72" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="870" cy="358" r="47" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/><text x="870" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">确认决定</text><text x="870" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">录用 · 淘汰 · 排序</text><text x="338" y="490" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">只交付数据与提示</text><text x="896" y="490" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">承担最终招聘责任</text></svg>